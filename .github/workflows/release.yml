name: Build & Release

# Push na main = sam build (sprawdzenie, że się kompiluje).
# Tag vX.Y.Z = release z APK i instalatorem OpenTakeoff dla Windows w wersji X.Y.Z.
# Budowanie i wydanie wyłącznie po wypchnięciu tagu wersji (np. v1.2.3).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Wersja z tagu (v2.0.0 → 2.0.0); bez tagu build ma wersję 0.0.0 i nie jest wydawany
      - name: Wersja
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag musi mieć postać vX.Y.Z"; exit 1; }
          else
            VERSION="0.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # SDK jest preinstalowane na ubuntu-latest; doinstalowujemy tylko platformę 35
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      # Opcjonalny własny klucz: sekrety SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
      # SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD. Bez nich APK jest podpisane kluczem debug.
      - name: Przygotuj keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK do publikacji
        run: cp app/build/outputs/apk/release/app-release.apk "OpenTakeoff-$APP_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: OpenTakeoff-*.apk

  # OpenTakeoff dla Windows (Rust): dziennik lotów, briefing i most MSFS ↔ telefon – dawny OpenTakeoff Link.
  # Buduje się równolegle z APK; wydanie powstaje dopiero z oboma plikami (job publish),
  # a redzikowski.com pokazuje instalator jako wersję na Windows.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - name: Wersja
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OPENTAKEOFF_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Rust
        shell: bash
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Testy
        run: cargo test --release -p opentakeoff-core -p opentakeoff-msfs -p opentakeoff

      - name: Budowanie
        run: cargo build --release -p opentakeoff

      - name: Podpis cyfrowy
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory ../dist, ../out -Force | Out-Null
          Copy-Item target/release/OpenTakeoff.exe ../dist/
          # Tylko gdy w sekretach jest certyfikat (.pfx w base64) i hasło.
          if (-not $env:WIN_CERT) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f $pfx /p $env:WIN_CERT_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "OpenTakeoff" ../dist/OpenTakeoff.exe
          if ($LASTEXITCODE -ne 0) { throw "Podpisywanie nie powiodło się" }
          Remove-Item $pfx

      - name: Instalator
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer/OpenTakeoff.iss
          if ($LASTEXITCODE -ne 0) { throw "Instalator nie powstał" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/OpenTakeoff-Setup-*.exe

  # Wydanie zawsze z kompletem: APK + instalator Windows + sumy kontrolne. Gdy któryś build padnie,
  # wydania nie ma wcale (kanał aktualizacji zostaje na poprzedniej, pełnej wersji).
  publish:
    needs: [android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publikuj release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/OpenTakeoff-$VERSION.apk" || { echo "::error::Brak APK"; exit 1; }
          test -f "dist/OpenTakeoff-Setup-$VERSION.exe" || { echo "::error::Brak instalatora Windows"; exit 1; }
          (cd dist && sha256sum OpenTakeoff-* > SHA256SUMS.txt)
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b')
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenTakeoff $VERSION" --notes "$NOTES" --verify-tag
