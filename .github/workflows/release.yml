name: Build & Release

# Push na main = sam build (sprawdzenie, że się kompiluje).
# Tag vX.Y.Z = release z podpisanym APK i OpenTakeoff-Link.exe w wersji X.Y.Z.
# Budowanie i wydanie wyłącznie po wypchnięciu tagu wersji (np. v1.2.3).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Wersja z tagu (v2.0.0 → 2.0.0); bez tagu build ma wersję 0.0.0 i nie jest wydawany
      - name: Wersja
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag musi mieć postać vX.Y.Z"; exit 1; }
          else
            VERSION="0.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # SDK jest preinstalowane na ubuntu-latest; doinstalowujemy tylko platformę 35
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      # Opcjonalny własny klucz: sekrety SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD,
      # SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD. Bez nich APK jest podpisane kluczem debug.
      - name: Przygotuj keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publikuj release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "OpenTakeoff-$APP_VERSION.apk"
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b')
          gh release create "$GITHUB_REF_NAME" "OpenTakeoff-$APP_VERSION.apk" \
            --title "OpenTakeoff $APP_VERSION" \
            --notes "$NOTES" \
            --verify-tag

  # OpenTakeoff Link (most MSFS ↔ telefon) — dołączany do tego samego release co APK.
  # Osobny job po APK: jego błąd nie blokuje wydania aplikacji.
  link:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Wersja
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0"; fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Testy
        run: dotnet test bridge/OpenAirBookLink.Tests/OpenAirBookLink.Tests.csproj -c Release

      - name: Publikuj OpenTakeoff-Link.exe
        shell: bash
        run: |
          dotnet publish bridge/OpenAirBookLink/OpenAirBookLink.csproj -c Release -o publish -p:Version=$APP_VERSION
          cp publish/OpenTakeoff-Link.exe OpenTakeoff-Link.exe

      - name: Dołącz do release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" OpenTakeoff-Link.exe --clobber
